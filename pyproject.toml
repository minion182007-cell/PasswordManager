[project]
name = "password-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Кирилл Кадетов", email = "minion18.2007@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
]

[project.scripts]
password-manager = "password_manager:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.uv.build-backend]
module-root = ""
